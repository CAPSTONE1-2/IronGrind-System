<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">IronGrind System Architecture</title>
  <desc id="desc">Architecture showing staff and members using browser pages hosted as static files, connecting through the Supabase JavaScript client to Supabase Auth and a PostgreSQL database protected by row-level security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#7f1010"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#d3d9e3"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ef4444"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{fill:#f5f6f8;font-size:34px;font-weight:750;letter-spacing:.2px}
      .subtitle{fill:#9da7b6;font-size:16px}
      .section{fill:#f3f4f6;font-size:20px;font-weight:700}
      .label{fill:#f3f4f6;font-size:17px;font-weight:700}
      .body{fill:#c2c9d4;font-size:14px}
      .small{fill:#aeb7c5;font-size:12px}
      .muted{fill:#8792a2;font-size:12px}
      .card{fill:#151a22;stroke:#343c49;stroke-width:1.5}
      .inner{fill:#0e1218;stroke:#343c49;stroke-width:1}
      .flow{fill:none;stroke:#d3d9e3;stroke-width:2.4;marker-end:url(#arrow)}
      .flowRed{fill:none;stroke:#ef4444;stroke-width:2.5;marker-end:url(#arrowRed)}
      .dash{fill:none;stroke:#747f8f;stroke-width:1.8;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1395" cy="120" r="230" fill="#9b1111" opacity=".08"/>
  <circle cx="140" cy="900" r="250" fill="#9b1111" opacity=".05"/>

  <text x="800" y="68" class="title" text-anchor="middle">IRON GRIND</text>
  <text x="800" y="98" class="subtitle" text-anchor="middle">Fitness Gym Membership &amp; Operations Management System — System Architecture</text>

  <!-- User roles -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="260" height="520" rx="22" class="card"/>
  </g>
  <text x="200" y="232" class="section" text-anchor="middle">USERS</text>
  <rect x="100" y="265" width="200" height="145" rx="16" fill="url(#red)"/>
  <circle cx="200" cy="304" r="18" fill="#fff" opacity=".95"/>
  <path d="M168 365c3-26 16-39 32-39s29 13 32 39" fill="#fff" opacity=".95"/>
  <text x="200" y="390" class="label" text-anchor="middle">Administrator / Staff</text>
  <text x="200" y="440" class="body" text-anchor="middle">
    <tspan x="200">Reviews applications</tspan>
    <tspan x="200" dy="22">Records attendance</tspan>
    <tspan x="200" dy="22">Manages products and sales</tspan>
    <tspan x="200" dy="22">Views operational reports</tspan>
  </text>
  <rect x="100" y="545" width="200" height="125" rx="16" class="inner"/>
  <circle cx="200" cy="580" r="15" fill="#b91c1c"/>
  <path d="M174 631c2-20 12-31 26-31s24 11 26 31" fill="#b91c1c"/>
  <text x="200" y="652" class="label" text-anchor="middle">Member / Applicant</text>
  <text x="200" y="690" class="small" text-anchor="middle">Registers, views membership, QR and history</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="415" y="190" width="390" height="520" rx="22" class="card"/>
  </g>
  <text x="610" y="232" class="section" text-anchor="middle">WEB APPLICATION</text>
  <rect x="455" y="260" width="310" height="60" rx="12" fill="#202733" stroke="#495363"/>
  <text x="610" y="286" class="label" text-anchor="middle">Web Browser</text>
  <text x="610" y="306" class="small" text-anchor="middle">Desktop, tablet, or mobile</text>
  <path d="M610 320v25" class="flow"/>
  <rect x="455" y="350" width="310" height="145" rx="14" class="inner"/>
  <text x="610" y="382" class="label" text-anchor="middle">Frontend Pages</text>
  <text x="475" y="414" class="body">
    <tspan x="475">index.html — sign in</tspan>
    <tspan x="475" dy="24">register.html — applications</tspan>
    <tspan x="475" dy="24">admin.html — staff operations</tspan>
    <tspan x="475" dy="24">customer.html — member portal</tspan>
  </text>
  <rect x="455" y="525" width="310" height="80" rx="14" fill="#241315" stroke="#8e2528"/>
  <text x="610" y="557" class="label" text-anchor="middle">HTML · CSS · JavaScript</text>
  <text x="610" y="581" class="small" text-anchor="middle">UI, forms, QR workflows, reports</text>
  <rect x="455" y="625" width="310" height="55" rx="12" fill="#351719" stroke="#a83235"/>
  <text x="610" y="658" class="label" text-anchor="middle">Supabase JavaScript Client</text>

  <!-- Cloud boundary -->
  <rect x="875" y="155" width="660" height="600" rx="30" fill="#10141b" fill-opacity=".58" stroke="#596474" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="1080" y="137" width="190" height="38" rx="19" fill="#252b35"/>
  <text x="1175" y="162" class="label" text-anchor="middle">SUPABASE CLOUD</text>

  <!-- Auth -->
  <g filter="url(#shadow)">
    <rect x="930" y="215" width="255" height="190" rx="18" class="card"/>
  </g>
  <rect x="952" y="238" width="48" height="48" rx="12" fill="url(#red)"/>
  <path d="M976 246v12m-8 3h16v15h-16z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1015" y="266" class="label">Supabase Auth</text>
  <text x="952" y="316" class="body">
    <tspan x="952">Sign-in and session handling</tspan>
    <tspan x="952" dy="23">User identity and role linkage</tspan>
    <tspan x="952" dy="23">Password recovery / confirmation</tspan>
  </text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="1220" y="215" width="270" height="450" rx="18" class="card"/>
  </g>
  <ellipse cx="1355" cy="262" rx="72" ry="22" fill="#8f171a" stroke="#e05a5d" stroke-width="2"/>
  <path d="M1283 262v52c0 12 32 22 72 22s72-10 72-22v-52" fill="#5f171b" stroke="#e05a5d" stroke-width="2"/>
  <ellipse cx="1355" cy="314" rx="72" ry="22" fill="#761a1d" stroke="#e05a5d" stroke-width="2"/>
  <text x="1355" y="278" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">POSTGRESQL</text>
  <text x="1355" y="373" class="section" text-anchor="middle">Application Data</text>
  <text x="1247" y="412" class="body">
    <tspan x="1247">profiles</tspan>
    <tspan x="1247" dy="25">members</tspan>
    <tspan x="1247" dy="25">membership_applications</tspan>
    <tspan x="1247" dy="25">attendance</tspan>
    <tspan x="1247" dy="25">products</tspan>
    <tspan x="1247" dy="25">sales · sale_items</tspan>
    <tspan x="1247" dy="25">membership_history</tspan>
  </text>
  <rect x="1245" y="600" width="220" height="42" rx="10" fill="#241315" stroke="#8e2528"/>
  <text x="1355" y="627" class="small" text-anchor="middle">Row-Level Security (RLS)</text>

  <!-- Flows -->
  <path d="M330 330h80" class="flow"/>
  <path d="M330 600h80" class="flow"/>
  <path d="M805 652h42v-342h75" class="flowRed"/>
  <path d="M805 652h395v-200h20" class="flowRed"/>
  <path d="M1185 310h35" class="flow"/>
  <path d="M1185 350h18v102h17" class="dash"/>
  <text x="1196" y="433" class="muted" text-anchor="middle">authorized data access</text>

  <!-- Hosting / dev note -->
  <rect x="415" y="785" width="1120" height="110" rx="18" fill="#11161c" stroke="#343c49"/>
  <text x="450" y="823" class="label">Deployment and development notes</text>
  <text x="450" y="852" class="body">
    <tspan x="450">Static web hosting serves the HTML, CSS, JavaScript, and image assets. Supabase provides the hosted authentication and database services.</tspan>
    <tspan x="450" dy="23">The local Node.js server is for development file serving; it is not the production application API or database.</tspan>
  </text>

  <!-- Legend -->
  <path d="M78 820h62" class="flow"/>
  <text x="155" y="825" class="small">User request / response path</text>
  <path d="M78 858h62" class="flowRed"/>
  <text x="155" y="863" class="small">Frontend connection to Supabase</text>
  <text x="800" y="960" class="muted" text-anchor="middle">Architecture is based on the current project pages and Supabase schema; hosting configuration may vary by deployment.</text>
</svg>
