<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1600" viewBox="0 0 1750 1600" role="img" aria-labelledby="title desc">
<title id="title">IronGrind System Architecture Diagram</title>
<desc id="desc">A detailed, reference-style architecture diagram showing login and authentication, application pages, operational service icons, labeled Supabase data flows, and their connection to the PostgreSQL database tables.</desc>
<defs>
<marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#333"/></marker>
<marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#777"/></marker>
<style>
text{font-family:"Times New Roman",serif;fill:#111}.title{font-size:24px;font-weight:bold}.hdr{font-size:13px;font-weight:bold}.lbl{font-size:11px}.sm{font-size:9px}.xs{font-size:8px}
.box{fill:#fff;stroke:#444;stroke-width:1.2}.soft{fill:#f7f7f7;stroke:#555;stroke-width:1.2}
.wire{fill:none;stroke:#444;stroke-width:1.05;marker-end:url(#a)}.back{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:4 3;marker-end:url(#b)}
.line{fill:none;stroke:#444;stroke-width:1}
</style></defs>
<rect width="1750" height="1600" fill="#fff"/>
<text x="875" y="32" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>

<!-- Actors, login, authentication, application -->
<g transform="translate(385 53)"><circle cx="17" cy="11" r="9" fill="#111"/><path d="M1 45c1-14 6-21 16-21s15 7 16 21z" fill="#111"/><text x="17" y="59" text-anchor="middle" class="sm">Member / Applicant</text></g>
<g transform="translate(1328 53)"><circle cx="17" cy="11" r="9" fill="#111"/><path d="M1 45c1-14 6-21 16-21s15 7 16 21z" fill="#111"/><text x="17" y="59" text-anchor="middle" class="sm">Administrator / Staff</text></g>
<rect x="760" y="54" width="230" height="54" class="box"/><text x="875" y="76" text-anchor="middle" class="hdr">🔑 Login Page</text><text x="875" y="94" text-anchor="middle" class="xs">index.html</text>
<path d="M420 82H755" class="wire"/><text x="585" y="73" text-anchor="middle" class="xs">User input: email + password</text>
<path d="M1328 82H995" class="wire"/><text x="1160" y="73" text-anchor="middle" class="xs">Admin input: email + password</text>
<path d="M875 108V138" class="wire"/><text x="886" y="127" class="xs">signInWithPassword()</text>
<rect x="760" y="143" width="230" height="58" class="soft"/><text x="875" y="166" text-anchor="middle" class="hdr">🔐 Supabase Auth</text><text x="875" y="185" text-anchor="middle" class="xs">Credential verification + session</text>
<path d="M760 173H735V81H755" class="back"/><text x="726" y="142" text-anchor="end" class="xs">Authentication result / error</text>
<path d="M875 201V226" class="wire"/><text x="886" y="219" class="xs">successful login</text>
<rect x="705" y="231" width="340" height="55" class="box"/><text x="875" y="253" text-anchor="middle" class="hdr">Load profiles.role by Auth user ID</text><text x="875" y="272" text-anchor="middle" class="xs">Admin role → admin.html · member role → membership lookup</text>
<path d="M705 258H655V303H565" class="wire"/><text x="623" y="296" text-anchor="middle" class="xs">role = customer</text>
<rect x="375" y="305" width="190" height="50" class="box"/><text x="470" y="326" text-anchor="middle" class="hdr">Member lookup</text><text x="470" y="344" text-anchor="middle" class="xs">members.auth_user_id = user.id</text>
<path d="M375 330H325" class="wire"/><rect x="160" y="305" width="165" height="50" class="soft"/><text x="242" y="326" text-anchor="middle" class="hdr">customer.html</text><text x="242" y="344" text-anchor="middle" class="xs">or show application status</text>
<path d="M470 355V368H255V360" class="back"/>
<path d="M1045 258H1095V303H1185" class="wire"/><text x="1110" y="296" text-anchor="middle" class="xs">role = admin</text>
<rect x="1185" y="305" width="190" height="50" class="box"/><text x="1280" y="326" text-anchor="middle" class="hdr">Admin session</text><text x="1280" y="344" text-anchor="middle" class="xs">profile.role = admin</text>
<path d="M1375 330H1425" class="wire"/><rect x="1425" y="305" width="165" height="50" class="soft"/><text x="1507" y="326" text-anchor="middle" class="hdr">admin.html</text><text x="1507" y="344" text-anchor="middle" class="xs">operations dashboard</text>
<rect x="230" y="387" width="1290" height="50" class="soft"/>
<text x="875" y="408" text-anchor="middle" class="hdr">📝 Registration path: register.html → Supabase Auth signUp() → profiles row via Auth trigger → membership_applications row (pending)</text>
<text x="875" y="426" text-anchor="middle" class="xs">After email confirmation / session; staff-created accounts also use admin-create-member Edge Function → Auth Admin API → admin_create_member_and_sale RPC</text>

<!-- Session bus and pages -->
<path d="M242 355V461H145M1507 355V461H1605M145 461H1605" class="line"/>
<text x="875" y="455" text-anchor="middle" class="xs">Role-authorized user session</text>
<path d="M145 461V482" class="wire"/>
<rect x="37" y="487" width="216" height="76" class="box"/>
<text x="145" y="510" text-anchor="middle" font-size="23">📝</text>
<text x="145" y="530" text-anchor="middle" class="hdr">Applications &amp; Membership</text>
<text x="145" y="549" text-anchor="middle" class="xs">register.html · admin.html</text>
<path d="M145 563V603" class="wire"/>
<text x="145" y="615" text-anchor="middle" font-size="22">📝</text>
<text x="145" y="698" text-anchor="middle" class="hdr">Applications Service</text>
<text x="145" y="716" text-anchor="middle" class="xs">Submit registration • review approval</text>
<text x="145" y="733" text-anchor="middle" class="xs">Tables: applications | members | sales | sale_items</text>
<path d="M437 461V482" class="wire"/>
<rect x="329" y="487" width="216" height="76" class="box"/>
<text x="437" y="510" text-anchor="middle" font-size="23">📅</text>
<text x="437" y="530" text-anchor="middle" class="hdr">Attendance / QR</text>
<text x="437" y="549" text-anchor="middle" class="xs">admin.html · customer.html</text>
<path d="M437 563V603" class="wire"/>
<text x="437" y="615" text-anchor="middle" font-size="22">📷</text>
<text x="437" y="698" text-anchor="middle" class="hdr">Attendance Service</text>
<text x="437" y="716" text-anchor="middle" class="xs">Resolve QR • check-in / check-out</text>
<text x="437" y="733" text-anchor="middle" class="xs">Tables: members | attendance</text>
<path d="M729 461V482" class="wire"/>
<rect x="621" y="487" width="216" height="76" class="box"/>
<text x="729" y="510" text-anchor="middle" font-size="23">📦</text>
<text x="729" y="530" text-anchor="middle" class="hdr">Inventory &amp; Products</text>
<text x="729" y="549" text-anchor="middle" class="xs">admin.html · read-only member view</text>
<path d="M729 563V603" class="wire"/>
<text x="729" y="615" text-anchor="middle" font-size="22">⚙️</text>
<text x="729" y="698" text-anchor="middle" class="hdr">Inventory Service</text>
<text x="729" y="716" text-anchor="middle" class="xs">Product CRUD • stock • active catalog</text>
<text x="729" y="733" text-anchor="middle" class="xs">Tables: products</text>
<path d="M1021 461V482" class="wire"/>
<rect x="913" y="487" width="216" height="76" class="box"/>
<text x="1021" y="510" text-anchor="middle" font-size="23">🧾</text>
<text x="1021" y="530" text-anchor="middle" class="hdr">Walk-in POS / Receipts</text>
<text x="1021" y="549" text-anchor="middle" class="xs">staff-entered sale</text>
<path d="M1021 563V603" class="wire"/>
<text x="1021" y="615" text-anchor="middle" font-size="22">💳</text>
<text x="1021" y="698" text-anchor="middle" class="hdr">Sales Service (RPC)</text>
<text x="1021" y="716" text-anchor="middle" class="xs">record_walk_in_sale()</text>
<text x="1021" y="733" text-anchor="middle" class="xs">Tables: products | sales | sale_items</text>
<path d="M1313 461V482" class="wire"/>
<rect x="1205" y="487" width="216" height="76" class="box"/>
<text x="1313" y="510" text-anchor="middle" font-size="23">👤</text>
<text x="1313" y="530" text-anchor="middle" class="hdr">Member Portal</text>
<text x="1313" y="549" text-anchor="middle" class="xs">customer.html</text>
<path d="M1313 563V603" class="wire"/>
<text x="1313" y="615" text-anchor="middle" font-size="22">🔄</text>
<text x="1313" y="698" text-anchor="middle" class="hdr">Member Data Service</text>
<text x="1313" y="716" text-anchor="middle" class="xs">Own membership • visits • catalog</text>
<text x="1313" y="733" text-anchor="middle" class="xs">Tables: members | attendance | products | applications</text>
<path d="M1605 461V482" class="wire"/>
<rect x="1497" y="487" width="216" height="76" class="box"/>
<text x="1605" y="510" text-anchor="middle" font-size="23">📊</text>
<text x="1605" y="530" text-anchor="middle" class="hdr">Reports &amp; Exports</text>
<text x="1605" y="549" text-anchor="middle" class="xs">admin.html</text>
<path d="M1605 563V603" class="wire"/>
<text x="1605" y="615" text-anchor="middle" font-size="22">🔎</text>
<text x="1605" y="698" text-anchor="middle" class="hdr">Report Query Service</text>
<text x="1605" y="716" text-anchor="middle" class="xs">Frontend filters / authorized SELECT</text>
<text x="1605" y="733" text-anchor="middle" class="xs">Reads: members | attendance | inventory | sales | history</text>
<text x="875" y="816" text-anchor="middle" class="hdr">📡 SUPABASE CLIENT CALLS AND LABELED DATA FLOWS</text>
<text x="875" y="835" text-anchor="middle" class="xs">Direct .from(table) queries / writes and .rpc(function) calls; service-role Edge Function is a separate privileged route</text>
<!-- Parallel request and response paths, one per workflow -->
<path d="M145 855V1155" class="wire"/><path d="M153 1155V855" class="back"/>
<text x="134" y="1010" transform="rotate(-90 134 1010)" class="xs">application and membership data</text>
<path d="M437 855V1155" class="wire"/><path d="M445 1155V855" class="back"/>
<text x="426" y="1010" transform="rotate(-90 426 1010)" class="xs">member lookup and attendance records</text>
<path d="M729 855V1155" class="wire"/><path d="M737 1155V855" class="back"/>
<text x="718" y="1010" transform="rotate(-90 718 1010)" class="xs">product and inventory data</text>
<path d="M1021 855V1155" class="wire"/><path d="M1029 1155V855" class="back"/>
<text x="1010" y="1010" transform="rotate(-90 1010 1010)" class="xs">sale, receipt, and stock data</text>
<path d="M1313 855V1155" class="wire"/><path d="M1321 1155V855" class="back"/>
<text x="1302" y="1010" transform="rotate(-90 1302 1010)" class="xs">own profile, visit, renewal data</text>
<path d="M1605 855V1155" class="wire"/><path d="M1613 1155V855" class="back"/>
<text x="1594" y="1010" transform="rotate(-90 1594 1010)" class="xs">filtered reports and query results</text>
<rect x="100" y="1165" width="1550" height="88" class="soft"/>
<text x="875" y="1190" text-anchor="middle" class="hdr">Supabase Data API / RPC + Row-Level Security (RLS)</text>
<text x="875" y="1211" text-anchor="middle" class="xs">Authenticated requests are checked against user role, record ownership, and database rules before reads or writes.</text>
<text x="875" y="1230" text-anchor="middle" class="xs">Staff-created accounts use admin-create-member Edge Function; it verifies the admin before service-role database operations.</text>
<path d="M875 1253V1300" class="wire"/>
<ellipse cx="875" cy="1325" rx="165" ry="30" fill="#111"/>
<path d="M710 1325V1455C710 1472 784 1485 875 1485S1040 1472 1040 1455V1325" fill="#111"/>
<ellipse cx="875" cy="1455" rx="165" ry="30" fill="#111"/>
<text x="875" y="1322" text-anchor="middle" style="fill:#fff;font-size:18px;font-weight:bold">SUPABASE POSTGRESQL</text>
<text x="875" y="1352" text-anchor="middle" style="fill:#fff;font-size:11px">Shared system database</text>
<text x="875" y="1373" text-anchor="middle" style="fill:#fff;font-size:10px">profiles · members · membership_applications</text>
<text x="875" y="1393" text-anchor="middle" style="fill:#fff;font-size:10px">attendance · products · sales · sale_items</text>
<text x="875" y="1413" text-anchor="middle" style="fill:#fff;font-size:10px">membership_history</text>
<text x="875" y="1525" text-anchor="middle" class="title">Figure 3. System Architecture Diagram</text>
<text x="875" y="1550" text-anchor="middle" class="xs">Solid arrows: requests / records saved · dashed arrows: authentication result / response · browser is the client; Supabase hosts Auth, Edge Functions, and PostgreSQL</text>
</svg>
