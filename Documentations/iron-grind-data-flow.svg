<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Iron Grind Fitness Gym Data Flow Diagram</title>
<desc id="desc">A monochrome, numbered-process data flow diagram showing applicant, member and administrator interactions with the browser application, Supabase Auth, Edge Functions, Realtime, RLS-protected PostgreSQL data stores and the static web server.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker>
  <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#111"/></marker>
  <style>
    text{font-family:"Times New Roman",serif;fill:#111}
    .title{font-size:23px;font-weight:bold}
    .section{font-size:13px;font-weight:bold;letter-spacing:.5px}
    .node-title{font-size:13px;font-weight:bold}
    .node-sub{font-size:10px}
    .label{font-size:10px}
    .small{font-size:9px}
    .entity{fill:#fff;stroke:#111;stroke-width:1.4}
    .process{fill:#fff;stroke:#111;stroke-width:1.4}
    .service{fill:#f4f4f4;stroke:#111;stroke-width:1.4}
    .flow{fill:none;stroke:#111;stroke-width:1.2;marker-end:url(#arrow)}
    .duplex{fill:none;stroke:#111;stroke-width:1.2;marker-start:url(#arrow-start);marker-end:url(#arrow)}
    .plain{fill:none;stroke:#111;stroke-width:1.1}
    .store{fill:#fff;stroke:#111;stroke-width:1.2}
    .rule{stroke:#111;stroke-width:1}
  </style>
</defs>
<rect width="1600" height="1120" fill="#fff"/>
<text x="800" y="38" text-anchor="middle" class="title">IRON GRIND FITNESS GYM MEMBERSHIP &amp; OPERATIONS MANAGEMENT SYSTEM</text>
<text x="800" y="60" text-anchor="middle" class="section">LEVEL 1 DATA FLOW DIAGRAM</text>

<!-- Column headings -->
<text x="110" y="100" text-anchor="middle" class="section">EXTERNAL ENTITIES</text>
<text x="450" y="100" text-anchor="middle" class="section">BROWSER PROCESSES</text>
<text x="835" y="100" text-anchor="middle" class="section">SUPABASE SERVICES</text>
<text x="1355" y="100" text-anchor="middle" class="section">DATA STORES</text>

<!-- External entities -->
<rect x="35" y="145" width="150" height="62" class="entity"/>
<text x="110" y="171" text-anchor="middle" class="node-title">Applicant</text>
<text x="110" y="190" text-anchor="middle" class="node-sub">registration details</text>

<rect x="35" y="390" width="150" height="62" class="entity"/>
<text x="110" y="416" text-anchor="middle" class="node-title">Member</text>
<text x="110" y="435" text-anchor="middle" class="node-sub">account and renewal</text>

<rect x="35" y="710" width="150" height="62" class="entity"/>
<text x="110" y="736" text-anchor="middle" class="node-title">Admin / Staff</text>
<text x="110" y="755" text-anchor="middle" class="node-sub">gym operations</text>

<rect x="35" y="890" width="150" height="62" class="entity"/>
<text x="110" y="916" text-anchor="middle" class="node-title">Email inbox</text>
<text x="110" y="935" text-anchor="middle" class="node-sub">confirmation / recovery link</text>

<!-- Browser processes -->
<rect x="285" y="130" width="330" height="88" class="process"/>
<circle cx="307" cy="152" r="15" class="entity"/>
<text x="307" y="156" text-anchor="middle" class="small">1.0</text>
<text x="455" y="157" text-anchor="middle" class="node-title">Account and session</text>
<text x="455" y="179" text-anchor="middle" class="node-sub">sign up, sign in/out, password recovery</text>
<text x="455" y="198" text-anchor="middle" class="small">index.html · register.html · reset-password.html</text>

<rect x="285" y="270" width="330" height="88" class="process"/>
<circle cx="307" cy="292" r="15" class="entity"/>
<text x="307" y="296" text-anchor="middle" class="small">2.0</text>
<text x="455" y="297" text-anchor="middle" class="node-title">Registration and renewal</text>
<text x="455" y="319" text-anchor="middle" class="node-sub">collect details, signature, plan and application</text>
<text x="455" y="338" text-anchor="middle" class="small">online registration and member renewal request</text>

<rect x="285" y="430" width="330" height="88" class="process"/>
<circle cx="307" cy="452" r="15" class="entity"/>
<text x="307" y="456" text-anchor="middle" class="small">3.0</text>
<text x="455" y="457" text-anchor="middle" class="node-title">Member portal</text>
<text x="455" y="479" text-anchor="middle" class="node-sub">view membership, attendance and active products</text>
<text x="455" y="498" text-anchor="middle" class="small">update personal information</text>

<rect x="285" y="590" width="330" height="88" class="process"/>
<circle cx="307" cy="612" r="15" class="entity"/>
<text x="307" y="616" text-anchor="middle" class="small">4.0</text>
<text x="455" y="617" text-anchor="middle" class="node-title">Admin membership management</text>
<text x="455" y="639" text-anchor="middle" class="node-sub">review applications, members and membership history</text>
<text x="455" y="658" text-anchor="middle" class="small">approve / reject · register member · renew / change plan</text>

<rect x="285" y="750" width="330" height="88" class="process"/>
<circle cx="307" cy="772" r="15" class="entity"/>
<text x="307" y="776" text-anchor="middle" class="small">5.0</text>
<text x="455" y="777" text-anchor="middle" class="node-title">Attendance, inventory and sales</text>
<text x="455" y="799" text-anchor="middle" class="node-sub">QR check-in/out · products and stock · receipts</text>
<text x="455" y="818" text-anchor="middle" class="small">admin/staff operational functions</text>

<rect x="285" y="910" width="330" height="72" class="process"/>
<circle cx="307" cy="932" r="15" class="entity"/>
<text x="307" y="936" text-anchor="middle" class="small">6.0</text>
<text x="455" y="938" text-anchor="middle" class="node-title">Reports and dashboard</text>
<text x="455" y="960" text-anchor="middle" class="node-sub">summarize authorized membership and operations data</text>

<!-- Supabase services -->
<rect x="700" y="130" width="270" height="88" class="service"/>
<text x="835" y="158" text-anchor="middle" class="node-title">Supabase Auth</text>
<text x="835" y="180" text-anchor="middle" class="node-sub">credential validation and user session</text>
<text x="835" y="199" text-anchor="middle" class="small">confirmation and password recovery email</text>

<rect x="700" y="360" width="270" height="108" class="service"/>
<text x="835" y="392" text-anchor="middle" class="node-title">Supabase Data API</text>
<text x="835" y="415" text-anchor="middle" class="node-sub">authenticated table queries and mutations</text>
<text x="835" y="435" text-anchor="middle" class="node-sub">RPCs · PostgreSQL Row Level Security</text>
<text x="835" y="454" text-anchor="middle" class="small">browser requests use the user's Auth session</text>

<rect x="700" y="610" width="270" height="98" class="service"/>
<text x="835" y="640" text-anchor="middle" class="node-title">7.0 Edge Functions</text>
<text x="835" y="663" text-anchor="middle" class="node-sub">verify admin identity and role</text>
<text x="835" y="683" text-anchor="middle" class="small">privileged member creation / store-password check</text>

<rect x="700" y="850" width="270" height="86" class="service"/>
<text x="835" y="880" text-anchor="middle" class="node-title">Supabase Realtime</text>
<text x="835" y="903" text-anchor="middle" class="node-sub">database change notifications to browser views</text>
<text x="835" y="922" text-anchor="middle" class="small">active publication: applications + attendance; not members</text>

<!-- Data stores -->
<g>
  <path d="M1120 130H1570M1120 158H1570" class="rule"/>
  <text x="1130" y="151" class="small">D1</text><text x="1170" y="150" class="node-title">auth.users</text>
  <text x="1470" y="150" text-anchor="end" class="node-sub">Auth identities</text>

  <path d="M1120 225H1570M1120 253H1570" class="rule"/>
  <text x="1130" y="246" class="small">D2</text><text x="1170" y="245" class="node-title">profiles</text>
  <text x="1470" y="245" text-anchor="end" class="node-sub">role and account profile</text>

  <path d="M1120 320H1570M1120 348H1570" class="rule"/>
  <text x="1130" y="341" class="small">D3</text><text x="1170" y="340" class="node-title">membership_applications</text>
  <text x="1518" y="340" text-anchor="end" class="node-sub">registration / renewal / review</text>

  <path d="M1120 415H1570M1120 443H1570" class="rule"/>
  <text x="1130" y="436" class="small">D4</text><text x="1170" y="435" class="node-title">members</text>
  <text x="1470" y="435" text-anchor="end" class="node-sub">approved member records</text>

  <path d="M1120 510H1570M1120 538H1570" class="rule"/>
  <text x="1130" y="531" class="small">D5</text><text x="1170" y="530" class="node-title">attendance</text>
  <text x="1470" y="530" text-anchor="end" class="node-sub">time in / time out</text>

  <path d="M1120 605H1570M1120 633H1570" class="rule"/>
  <text x="1130" y="626" class="small">D6</text><text x="1170" y="625" class="node-title">products</text>
  <text x="1470" y="625" text-anchor="end" class="node-sub">catalog and inventory</text>

  <path d="M1120 700H1570M1120 728H1570" class="rule"/>
  <text x="1130" y="721" class="small">D7</text><text x="1170" y="720" class="node-title">sales · sale_items</text>
  <text x="1470" y="720" text-anchor="end" class="node-sub">receipts and line items</text>

  <path d="M1120 795H1570M1120 823H1570" class="rule"/>
  <text x="1130" y="816" class="small">D8</text><text x="1170" y="815" class="node-title">membership_history</text>
  <text x="1518" y="815" text-anchor="end" class="node-sub">expiry / renewal / plan changes</text>
</g>

<!-- User and browser process flows -->
<path d="M185 176H285" class="flow"/><text x="235" y="165" text-anchor="middle" class="label">sign-up details</text>
<path d="M185 190H235V314H285" class="flow"/><text x="245" y="250" class="label">application form</text>
<path d="M185 421H235V174H285" class="flow"/><text x="245" y="399" class="label">email / password</text>
<path d="M185 435H255V474H285" class="flow"/><text x="236" y="466" class="label">member requests</text>
<path d="M185 735H235V174H285" class="flow"/><text x="245" y="704" class="label">admin credentials</text>
<path d="M185 748H255V634H285" class="flow"/><text x="242" y="687" class="label">review / management</text>
<path d="M185 761H270V794H285" class="flow"/><text x="240" y="783" class="label">check-in / sales</text>
<path d="M185 772H250V946H285" class="flow"/><text x="235" y="887" class="label">report requests</text>

<!-- Browser to Supabase service flows -->
<path d="M615 174H700" class="duplex"/><text x="657" y="161" text-anchor="middle" class="label">Auth request / session</text>
<path d="M615 314H660V390H700" class="duplex"/><text x="654" y="300" text-anchor="middle" class="label">application data</text>
<path d="M615 474H675V415H700" class="duplex"/><text x="660" y="464" text-anchor="middle" class="label">member data / renewal</text>
<path d="M615 634H650V437H700" class="duplex"/><text x="648" y="621" text-anchor="middle" class="label">review / admin queries</text>
<path d="M615 794H670V455H700" class="duplex"/><text x="658" y="778" text-anchor="middle" class="label">operations / RPCs</text>
<path d="M615 946H685V465H700" class="duplex"/><text x="666" y="928" text-anchor="middle" class="label">report queries</text>
<path d="M615 650H660V659H700" class="flow"/><text x="660" y="676" text-anchor="middle" class="small">admin-only requests</text>

<!-- Auth and account data -->
<path d="M970 174H1085V144H1120" class="duplex"/><text x="1037" y="132" text-anchor="middle" class="label">create / verify user</text>
<path d="M1345 158V225" class="flow"/><text x="1360" y="196" class="small">signup trigger creates profile</text>
<path d="M970 190H1040V239H1120" class="flow"/><text x="1035" y="222" text-anchor="middle" class="small">profile role lookup</text>
<path d="M110 890V244H700V199" class="flow"/><text x="402" y="235" text-anchor="middle" class="small">Supabase confirmation / recovery email</text>

<!-- Data API to protected database tables -->
<path d="M970 390H1080V334H1120" class="duplex"/><text x="1045" y="322" text-anchor="middle" class="small">submit / review</text>
<path d="M970 405H1060V429H1120" class="duplex"/><text x="1045" y="422" text-anchor="middle" class="small">read / update</text>
<path d="M970 420H1040V524H1120" class="duplex"/><text x="1035" y="514" text-anchor="middle" class="small">read / record</text>
<path d="M970 435H1020V619H1120" class="duplex"/><text x="1015" y="610" text-anchor="middle" class="small">read / manage</text>
<path d="M970 450H1000V714H1120" class="duplex"/><text x="1000" y="704" text-anchor="middle" class="small">receipt / items</text>
<path d="M970 465H985V809H1120" class="duplex"/><text x="990" y="799" text-anchor="middle" class="small">history RPCs</text>

<!-- Privileged Edge Function flows -->
<path d="M970 650H1080V144H1120" class="flow"/><text x="1060" y="594" text-anchor="middle" class="small">create Auth user (server credential)</text>
<path d="M970 675H1090V429H1120" class="flow"/><text x="1064" y="665" text-anchor="middle" class="small">admin_create_member_and_sale RPC</text>
<path d="M970 690H1100V714H1120" class="flow"/><text x="1060" y="731" text-anchor="middle" class="small">membership receipt</text>

<!-- Realtime data flow -->
<path d="M1120 334H1090V875H970" class="flow"/><text x="1080" y="858" text-anchor="end" class="small">application changes</text>
<path d="M1120 524H1050V905H970" class="flow"/><text x="1042" y="923" text-anchor="end" class="small">attendance changes</text>
<path d="M700 885H650V474H615" class="flow"/><text x="636" y="527" transform="rotate(-90 636 527)" text-anchor="middle" class="small">live updates to member view</text>
<path d="M700 900H635V634H615" class="flow"/><text x="621" y="770" transform="rotate(-90 621 770)" text-anchor="middle" class="small">live updates to admin view</text>

<!-- Explanatory boundary notes -->
<rect x="285" y="1010" width="1285" height="54" class="service"/>
<text x="305" y="1032" class="node-title">System boundary:</text>
<text x="410" y="1032" class="node-sub">server.js serves static HTML, CSS and JavaScript only; business-data requests go from the browser to Supabase.</text>
<text x="305" y="1052" class="node-sub">Browser requests use the publishable key and user session with RLS. Edge Functions verify the admin role before server-side privileged operations.</text>

<text x="800" y="1095" text-anchor="middle" class="title">Figure 4. Data Flow Diagram</text>
</svg>