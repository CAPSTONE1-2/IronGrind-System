<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronGrind · Member Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="logo-area">
            <div class="logo-icon">IG</div>
            <div class="logo-text">
                <h1>Iron<span>Grind</span></h1>
                <p>Member Dashboard</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="user-chip">
                <i class="fas fa-user"></i>
                <span id="currentUserName">Member</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <!-- ===== CUSTOMER VIEW ===== -->
    <div class="customer-view active">

        <!-- HERO -->
        <div class="customer-hero">
            <div>
                <h2>Welcome back MGA , <span id="heroName">Member!</span></h2>
                <p id="memberStatus">Your membership is active.</p>
            </div>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <button class="qr-badge" style="font-size:0.8rem; padding:10px 18px; cursor:pointer;" onclick="showQRCode()">
                    <i class="fas fa-qrcode"></i> Show QR Code
                </button>
                <button class="btn-primary" onclick="renewMembership()">
                    <i class="fas fa-sync-alt"></i> Renew Membership
                </button>
            </div>
        </div>

        <!-- MY RESERVATIONS -->
        <div class="panel" id="myReservationsPanel" style="display:none;">
            <div class="panel-header">
                <h2><i class="fas fa-bookmark"></i> My Active Reservations</h2>
            </div>
            <div id="myReservationsList"></div>
        </div>

        <!-- STORE -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fas fa-store"></i> Supplements &amp; Merch — Available for Reservation</h2>
            </div>
            <div class="supplement-grid" id="customerStoreGrid"></div>
        </div>

        <!-- MEMBERSHIP FORM -->
        <div class="membership-form-card">
            <h3><i class="fas fa-id-card"></i> Membership Registration / Renewal</h3>
            <form id="membershipForm" onsubmit="submitMembershipForm(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="mfName" placeholder="Juan Dela Cruz" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="mfContact" placeholder="0917 123 4567" required
                               inputmode="numeric" maxlength="13"
                               oninput="validatePhoneInput(this)">
                        <div class="field-error-msg hidden" id="mfContactError">
                            <i class="fas fa-exclamation-circle"></i> Only numbers are allowed.
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Membership Plan</label>
                        <select id="mfPlan">
                            <option value="Monthly|800">Monthly — ₱800</option>
                            <option value="Half Month|400">Half Month — ₱400</option>
                            <option value="Walk-in|80">Walk-in — ₱80</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fitness Goal</label>
                        <select id="mfGoal">
                            <option>Weight Loss</option>
                            <option>Muscle Gain</option>
                            <option>Strength</option>
                            <option>General Fitness</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Submit Membership Form
                </button>
            </form>
        </div>
    </div>

</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalContent"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="customer.js"></script>
</body>
</html>
