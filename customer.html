<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronGrind · Member Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dashboard-body">
<div id="page-loader" class="page-loader" aria-label="Loading dashboard" role="status"><div class="loader-content"><img class="loader-mark" src="assets/images/iron-grind-mark.png" alt=""><div class="loader-brand">Iron<span>Grind</span></div><div class="loader-track"><span></span></div></div></div>
<div class="app">
    <header class="app-header">
        <div class="logo-area"><img class="logo-icon logo-image" src="assets/images/iron-grind-mark.png" alt="Iron Grind Fitness Gym logo"><div class="logo-text"><h1>Iron<span>Grind</span></h1><p>Member Dashboard</p></div></div>
        <div class="header-actions">
            <div class="user-chip"><i class="fas fa-user"></i><span id="currentUserName">Member</span></div>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <main class="customer-view active customer-main">
        <!-- HERO -->
        <div class="customer-hero" id="member-overview">
            <div>
                <h2>Welcome, <span id="heroName">Member!</span></h2>
                <p id="memberStatus">Membership active.</p>
            </div>
            <button class="btn-primary" onclick="showQRCode()"><i class="fas fa-qrcode"></i> Show QR Code</button>
        </div>

        <!-- MEMBERSHIP PROGRESS -->
        <div class="member-insights-grid">
        <div class="panel" id="member-progress">
            <div class="panel-header">
                <h2><i class="fas fa-chart-line"></i> Membership Progress</h2>
            </div>
            <div id="membershipProgress"></div>
        </div>

        <!-- ATTENDANCE -->
        <div class="panel" id="member-attendance">
            <div class="panel-header">
                <h2><i class="fas fa-calendar-check"></i> My Attendance</h2>
                <span class="stat-sub" id="attendanceSummary"></span>
            </div>
            <div id="attendanceHistory"></div>
        </div>
        </div>

        <div class="member-tools-grid">
        <!-- MEMBERSHIP RENEWAL -->
        <details class="membership-form-card member-collapsible" id="member-request">
            <summary class="member-collapse-summary"><span><i class="fas fa-id-card"></i> Membership Renewal</span><i class="fas fa-chevron-down collapse-chevron" aria-hidden="true"></i></summary>
            <div class="member-collapse-content">
            <form id="membershipForm">
                <div class="form-group"><label for="mfName">Full Name</label><input type="text" id="mfName" readonly required></div>
                <div class="form-group">
                    <label for="mfPlan">Membership Plan</label>
                    <select id="mfPlan"><option value="Monthly|800">Monthly — ₱800</option><option value="Half Month|400">Half Month — ₱400</option><option value="Walk-in|80">Walk-in — ₱80</option></select>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Renewal Request</button>
                <p id="renewalFormStatus" role="status" aria-live="polite" style="min-height:1.25em; margin:10px 0 0; font-size:13px;"></p>
            </form>
            </div>
        </details>

        <details class="panel member-collapsible" id="member-settings">
            <summary class="panel-header member-collapse-summary">
                <span><i class="fas fa-gear"></i> Account Settings</span>
                <i class="fas fa-chevron-down collapse-chevron" aria-hidden="true"></i>
            </summary>
            <div class="member-collapse-content">
                <form id="memberSettingsForm">
                    <div class="form-group"><label for="settingsFullName">Full Name</label><input type="text" id="settingsFullName" autocomplete="name" required></div>
                    <div class="form-group"><label for="settingsMobile">Contact Number</label><input type="tel" id="settingsMobile" autocomplete="tel" placeholder="0917 123 4567"></div>
                    <button type="submit" class="btn-submit"><i class="fas fa-floppy-disk"></i> Save Information</button>
                    <p id="memberSettingsStatus" role="status" aria-live="polite" style="min-height:1.25em; margin:10px 0 0; font-size:13px;"></p>
                </form>
            </div>
        </details>

        <!-- STORE (VIEW ONLY) -->
        <details class="panel member-collapsible" id="member-store">
            <summary class="panel-header member-collapse-summary">
                <span class="member-store-title">
                <span class="member-store-heading"><i class="fas fa-store"></i> Available at the Gym</span>
                <span class="stat-sub"><i class="fas fa-info-circle"></i> Purchase in-store only</span>
                </span>
                <i class="fas fa-chevron-down collapse-chevron" aria-hidden="true"></i>
            </summary>
            <div class="member-collapse-content">
            <h3 class="store-section-label">Supplements</h3>
            <div class="product-grid view-only" id="customerSupplementsGrid"></div>
            <h3 class="store-section-label">Gym Merchandise</h3>
            <div class="product-grid view-only" id="customerMerchGrid"></div>
            </div>
        </details>
        </div>
    </main>
    <footer class="dashboard-footer">© 2026 Iron Grind Fitness Gym · Dapitan City</footer>
</div>

<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()"><div class="modal-content" id="modalContent"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/customer.js"></script>
</body>
</html>
