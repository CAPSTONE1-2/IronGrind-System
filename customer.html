<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronGrind · Member Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page-loader" class="page-loader" aria-label="Loading dashboard" role="status"><div class="loader-content"><div class="loader-brand">Iron<span>Grind</span></div><div class="loader-track"><span></span></div></div></div>
<div class="app">
    <header class="app-header">
        <div class="logo-area"><div class="logo-icon">IG</div><div class="logo-text"><h1>Iron<span>Grind</span></h1><p>Member Dashboard</p></div></div>
        <div class="header-actions"><div class="user-chip"><i class="fas fa-user"></i><span id="currentUserName">Member</span></div><button class="btn-logout" onclick="logout()">Logout</button></div>
    </header>

    <div class="customer-view active">
        <div class="customer-hero">
            <div><h2>Welcome, <span id="heroName">Member!</span></h2><p id="memberStatus">Membership active.</p></div>
            <button class="btn-primary" onclick="toast('QR shown')">Show QR Code</button>
        </div>
        <div class="panel"><div class="panel-header"><h2><i class="fas fa-store"></i> Store</h2></div><div class="supplement-grid" id="customerStoreGrid"></div></div>
        <div class="membership-form-card">
            <h3>Renew Membership</h3>
            <form onsubmit="submitMembershipForm(event)">
                <div class="form-row"><div class="form-group"><label>Name</label><input type="text" id="mfName" required></div><div class="form-group"><label>Contact</label><input type="tel" id="mfContact" required></div></div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>
</div>
<div id="modalOverlay" class="modal-overlay hidden"><div class="modal-content" id="modalContent"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="customer.js"></script>
</body>
</html>
